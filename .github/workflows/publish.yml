name: Publish npm packages

on:
    push:
        tags:
            - 'utils-v*'
            - 'restauth-sdk-v*'
            - 'auditlog-sdk-v*'

permissions:
    contents: read
    id-token: write

env:
    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Install Node & PNPM
              uses: pnpm/setup@v3
              with:
                  cache: true
                  install: true
                  require-lockfile: true

            - name: Select package
              id: pkg
              shell: bash
              run: |
                  if [[ "${GITHUB_REF_NAME}" == utils-v* ]]; then
                    echo "lib=utils" >> "$GITHUB_OUTPUT"
                    echo "dist=dist/libs/utils" >> "$GITHUB_OUTPUT"
                  elif [[ "${GITHUB_REF_NAME}" == restauth-sdk-v* ]]; then
                    echo "lib=restauth-sdk" >> "$GITHUB_OUTPUT"
                    echo "dist=dist/libs/restauth-sdk" >> "$GITHUB_OUTPUT"
                  elif [[ "${GITHUB_REF_NAME}" == auditlog-sdk-v* ]]; then
                    echo "lib=auditlog-sdk" >> "$GITHUB_OUTPUT"
                    echo "dist=dist/libs/auditlog-sdk" >> "$GITHUB_OUTPUT"
                  fi

            - name: Verify tag matches package version
              shell: bash
              run: |
                  tag_version="${GITHUB_REF_NAME##*-v}"
                  pkg_file="libs/${{ steps.pkg.outputs.lib }}/package.json"
                  pkg_version="$(node -p "require('./${pkg_file}').version")"
                  if [[ "$tag_version" != "$pkg_version" ]]; then
                    echo "::error::Tag ${GITHUB_REF_NAME} specifies ${tag_version} but ${pkg_file} is ${pkg_version}. Bump the version before tagging."
                    exit 1
                  fi
                  echo "Publishing ${pkg_version}"

            - run: pnpm nx build ${{ steps.pkg.outputs.lib }}

            - name: Configure npm auth token
              if: ${{ env.NODE_AUTH_TOKEN != '' }}
              run: pnpm config set --location=project "//registry.npmjs.org/:_authToken" "${NODE_AUTH_TOKEN}"

            - name: Verify npm auth
              run: pnpm whoami

            - run: pnpm publish --access public --no-git-checks
              working-directory: ${{ steps.pkg.outputs.dist }}
